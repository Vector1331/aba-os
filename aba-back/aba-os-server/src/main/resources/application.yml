spring:
  application:
    name: aba-os-server

  datasource:
    url: jdbc:postgresql://localhost:5432/aba-os
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: debug

# JWT Configuration
jwt:
  secret: abaOsSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLong2026
  access-token-validity: 3600000      # 1시간 (ms)
  refresh-token-validity: 604800000   # 7일 (ms)

# OpenAI Configuration
openai:
  api-key: ${OPENAI_API_KEY:}  # 환경변수로 주입, 없으면 빈 문자열
  model: gpt-3.5-turbo
  max-tokens: 500

# Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method