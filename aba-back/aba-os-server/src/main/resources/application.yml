spring:
  application:
    name: aba-os-server

  datasource:
    url: jdbc:postgresql://localhost:5432/aba-os
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update    # ?? ?? ? DB ??? ?? ??
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: debug