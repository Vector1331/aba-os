# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name dearone.kr www.dearone.kr;

    # All request to https://...
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Main Logic)
server {
    listen 443 ssl;
    server_name dearone.kr www.dearone.kr;

    # SSL Certificate location (Docker Volume Mount location)
    ssl_certificate /etc/letsencrypt/live/dearone.kr-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dearone.kr-0001/privkey.pem;

    # SSL Security setting
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Basic Route 
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_disable "MSIE [1-6]\.";

    # API proxy 
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Static files - React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets 
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers 
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}